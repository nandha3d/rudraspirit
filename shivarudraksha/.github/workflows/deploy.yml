name: Deploy Shiva Rudraksha to Production (shivarudraksha.in)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build catalogue website
        run: npm run build

      - name: Deploy to Server via SSH & Rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT || 22 }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude=uploads \
            --exclude=storage \
            dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/public_html/public/
          echo "✨ Shiva Rudraksha successfully deployed to shivarudraksha.in!"