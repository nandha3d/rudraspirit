<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURUM — Jewelry &amp; Watches</title>
<!--STORE_ENGINE-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/store/store.css">
<style>
  :root{
    --st-bg:#0c0b0a; --st-surface:#16130f; --st-ink:#f3ead6; --st-muted:#b3a487;
    --st-line:rgba(212,175,55,.18); --st-accent:#d4af37; --st-on-accent:#1a1509;
    --st-radius:14px; --st-font:"Inter",system-ui,sans-serif; --st-head:"Cormorant Garamond",serif;
  }
  body{margin:0;background:var(--st-bg);color:var(--st-ink);font-family:var(--st-font);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 1.3rem}
  nav{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.3rem;background:color-mix(in srgb,var(--st-bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--st-line)}
  .brand{font-family:var(--st-head);font-weight:700;font-size:1.5rem;letter-spacing:.1em}
  .brand b{color:var(--st-accent)}
  .navr{display:flex;gap:.5rem;align-items:center}
  .ibtn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--st-line);background:transparent;color:var(--st-ink);cursor:pointer;font-size:1.05rem}
  #cartCount{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:999px;background:var(--st-accent);color:var(--st-on-accent);font-size:.66rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .hero{position:relative;overflow:hidden;padding:6rem 0 4rem;text-align:center;background:radial-gradient(70% 120% at 50% -10%,color-mix(in srgb,var(--st-accent) 14%,transparent),transparent 60%)}
  .hero .eyebrow{font-family:var(--st-font);letter-spacing:.3em;text-transform:uppercase;font-size:.68rem;color:var(--st-accent)}
  .hero h1{font-family:var(--st-head);font-size:clamp(2.8rem,7vw,5.4rem);margin:.3rem 0;line-height:1;font-weight:600}
  .hero p{color:var(--st-muted);max-width:500px;margin:0 auto;font-size:1.02rem}
  .section-h{font-family:var(--st-head);font-size:1.9rem;margin:2.6rem 0 1.2rem;letter-spacing:.03em}
  main{padding-bottom:4rem}
  footer{border-top:1px solid var(--st-line);padding:2rem 1.3rem;text-align:center;color:var(--st-muted);font-size:.8rem}
  footer a{color:var(--st-accent)}
</style>
</head>
<body>
  <nav>
    <div class="brand"><b>AURUM</b></div>
    <div class="navr">
      <button class="ibtn" id="acctBtn" title="Account">👤</button>
      <button class="ibtn" id="cartBtn" title="Cart">🛒<span id="cartCount" style="display:none">0</span></button>
    </div>
  </nav>
  <header class="hero">
    <div class="eyebrow">Fine pieces</div>
    <h1>Quiet luxury.</h1>
    <p>Hand-finished jewelry and watches, made to last. Free shipping, cash on delivery.</p>
  </header>
  <main>
    <div class="wrap">
      <h2 class="section-h">The collection</h2>
      <div id="products" class="st-grid"></div>
    </div>
  </main>
  <footer>AURUM — a shivarudrakshainc marketplace template · wired to the live engine · <a href="/">shivarudrakshainc</a></footer>
  <script src="/assets/store/runtime.js"></script>
</body>
</html>
